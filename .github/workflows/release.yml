# Merging Knope's release pull request is the explicit release authorization the process
# requires. This workflow runs the gate and builds, smoke-tests and attests the five archives;
# only when all of that passes does `knope release` tag `v<version>` and publish the GitHub
# release with the archives and the changelog entry. This CLI has no irreversible registry
# publish, so the GitHub release is the last irreversible step. The Homebrew formula update
# follows it because the formula points at the release's archives; it runs only when the
# repository variable HOMEBREW_TAP is `true`, and can be re-run.
#
# Credentials: `knope release` uses the workflow's built-in GITHUB_TOKEN (contents: write on that
# job only). HOMEBREW_TAP_TOKEN lives in the `homebrew` environment, restricted to `main`, and
# only the `homebrew` job declares that environment.

name: Release

on:
    pull_request:
        types: [closed]
        branches: [main]

permissions:
    contents: read

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    # Only the merge of Knope's own release branch, from this repository, releases.
    authorize:
        name: Authorize the release
        if: >-
            github.head_ref == 'release'
            && github.event.pull_request.merged == true
            && github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        permissions: {}
        steps:
            - run: echo "Knope's release pull request from this repository was merged."

    # The same gate CI runs, on the merged commit, before anything is tagged or published.
    check:
        name: Check
        needs: authorize
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: jdx/mise-action@v5
              with:
                  cache: false
            - run: mise run check

    build:
        needs: authorize
        uses: ./.github/workflows/build-archives.yml
        permissions:
            contents: read
            id-token: write
            attestations: write

    release:
        name: Publish the GitHub release
        needs: [check, build]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/download-artifact@v8.0.2
              with:
                  path: artifacts
                  pattern: mcp-*
                  merge-multiple: true
            - uses: jdx/mise-action@v5
              with:
                  cache: false
            - run: mise run release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Opt in with the repository variable HOMEBREW_TAP = `true` once the `homebrew` environment
    # holds HOMEBREW_TAP_TOKEN (a token that can push to markmals/homebrew-tap only). Without the
    # variable this job is skipped, not failed.
    homebrew:
        name: Update the Homebrew formula
        needs: release
        if: vars.HOMEBREW_TAP == 'true'
        runs-on: ubuntu-latest
        environment: homebrew
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: actions/download-artifact@v8.0.2
              with:
                  path: artifacts
                  pattern: mcp-*
                  merge-multiple: true
            - uses: jdx/mise-action@v5
              with:
                  cache: false
                  install_args: rust
            - name: Write the formula
              run: mise run release:formula
              env:
                  MISE_TASK_RUN_AUTO_INSTALL: "false"
            - uses: actions/checkout@v7
              with:
                  repository: markmals/homebrew-tap
                  token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
                  path: homebrew-tap
            - name: Push the formula
              working-directory: homebrew-tap
              run: |
                  mkdir -p Formula
                  cp ../artifacts/mcp.rb Formula/mcp.rb
                  git add Formula/mcp.rb
                  if git diff --cached --quiet; then
                      echo "::notice::The formula is already current."
                      exit 0
                  fi
                  version="$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/mcp.rb)"
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git commit -m "mcp ${version}"
                  git push
