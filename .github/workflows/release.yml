# Merging Knope's release pull request is the explicit release authorization the process
# requires. This workflow runs the gate and builds, smoke-tests and attests the four archives;
# only when all of that passes does `knope release` tag `v<version>` and publish the GitHub
# release with the archives and the changelog entry. This CLI has no irreversible registry
# publish, so the GitHub release is the last irreversible step. The archives serve Mise's
# `github:` backend. Homebrew does not use them: markmals/homebrew-tap builds and bottles the
# formula from the `v<version>` tag, and moving that formula to a new tag is a pull request in
# the tap after this workflow publishes (README, Releasing).
#
# Credentials: `knope release` uses the workflow's built-in GITHUB_TOKEN (contents: write on that
# job only).

name: Release

on:
    pull_request:
        types: [closed]
        branches: [main]

permissions:
    contents: read

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    # Only the merge of Knope's own release branch, from this repository, releases.
    authorize:
        name: Authorize the release
        if: >-
            github.head_ref == 'release'
            && github.event.pull_request.merged == true
            && github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        permissions: {}
        steps:
            - run: echo "Knope's release pull request from this repository was merged."

    # The same gate CI runs, on the merged commit, before anything is tagged or published.
    check:
        name: Check
        needs: authorize
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: jdx/mise-action@v5
              with:
                  cache: false
            - run: mise run check

    build:
        needs: authorize
        uses: ./.github/workflows/build-archives.yml
        permissions:
            contents: read
            id-token: write
            attestations: write

    release:
        name: Publish the GitHub release
        needs: [check, build]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/download-artifact@v8.0.2
              with:
                  path: artifacts
                  pattern: mcp-*
                  merge-multiple: true
            - uses: jdx/mise-action@v5
              with:
                  cache: false
            - run: mise run release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
