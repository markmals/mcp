# Builds and attests one release archive per supported target: the `mcp` executable under a
# top-level `mcp-<target>/` directory, named so Mise's `github:` backend picks the right one.
# release.yml calls it; run it by hand (Actions → Build archives → Run workflow) to prove every
# target still builds before a release.

name: Build archives

on:
    workflow_call:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        name: ${{ matrix.target }}
        strategy:
            fail-fast: true
            matrix:
                # `smoke`: the runner can execute the target, so the archive is unpacked and run.
                include:
                    - target: aarch64-apple-darwin
                      os: macos-latest
                      smoke: true
                    - target: x86_64-apple-darwin
                      os: macos-latest
                      smoke: false
                    - target: aarch64-unknown-linux-musl
                      os: ubuntu-24.04-arm
                      smoke: true
                    - target: x86_64-unknown-linux-musl
                      os: ubuntu-latest
                      smoke: true
        runs-on: ${{ matrix.os }}
        permissions:
            contents: read
            id-token: write
            attestations: write
        env:
            # Only Rust is installed below; tasks must not install the rest of mise.toml.
            MISE_TASK_RUN_AUTO_INSTALL: "false"
            MISE_EXEC_AUTO_INSTALL: "false"
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: jdx/mise-action@v5
              with:
                  # A release workflow must not restore a cache: a lower-trust workflow that can
                  # write to the default branch could otherwise plant files in it.
                  cache: false
                  install_args: rust
            - name: Install the target
              run: mise exec -- rustup target add "${{ matrix.target }}"
            - name: Install musl-tools
              if: endsWith(matrix.target, '-linux-musl')
              run: sudo apt-get update && sudo apt-get install -y musl-tools
            - run: mise run package -- "${{ matrix.target }}"
              env:
                  # C code in dependencies, such as the TLS crypto provider, compiles with musl's
                  # compiler wrapper so it links into the static musl binary.
                  CC_aarch64_unknown_linux_musl: musl-gcc
                  CC_x86_64_unknown_linux_musl: musl-gcc
            # The shipped executable, unpacked from its archive: it starts its session daemon over
            # a Unix socket and reports a server it cannot start as unavailable, which proves the
            # static musl builds work, not just that they linked.
            - name: Smoke-test the archive
              if: matrix.smoke
              shell: bash
              env:
                  TARGET: ${{ matrix.target }}
              run: |
                  mkdir -p smoke/config
                  mkdir -m 700 smoke/run
                  tar -xzf "artifacts/mcp-$TARGET.tar.gz" -C smoke
                  mcp="smoke/mcp-$TARGET/mcp"
                  "$mcp" --version
                  echo '{"mcpServers":{"missing":{"command":"/nonexistent/mcp-server"}}}' > smoke/config/.mcp.json
                  env XDG_CONFIG_HOME="$PWD/smoke/config" XDG_STATE_HOME="$PWD/smoke/state" XDG_RUNTIME_DIR="$PWD/smoke/run" "$mcp" tools list > smoke/tools.json
                  jq -e '.complete == false and .unavailable[0].server == "missing"' smoke/tools.json
                  env XDG_CONFIG_HOME="$PWD/smoke/config" XDG_STATE_HOME="$PWD/smoke/state" XDG_RUNTIME_DIR="$PWD/smoke/run" "$mcp" servers disconnect --all
            - uses: actions/attest-build-provenance@v4.2.2
              with:
                  subject-path: artifacts/mcp-${{ matrix.target }}.tar.gz
            - uses: actions/upload-artifact@v7.0.2
              with:
                  name: mcp-${{ matrix.target }}
                  path: artifacts/mcp-${{ matrix.target }}.tar.gz
                  if-no-files-found: error
