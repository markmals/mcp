[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Release helpers for mcp: per-target archives and the Homebrew formula"

[dependencies]
flate2 = "1.1"
serde_json = "1.0"
sha2 = "0.11"
tar = "0.4"
zip = { version = "9.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3.27"

[lints]
workspace = true
